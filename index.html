<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:var(--w) 15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}

#drawer{position:fixed;inset:0;z-index:21;background:var(--bg);overflow-y:auto;padding:0 0 130px;-webkit-overflow-scrolling:touch}
.fv-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--bg);border-bottom:1px solid var(--line)}

.dots i.on{background:var(--ink)}.dots i.cur{background:var(--ember);transform:scale(1.4)}
.fv{max-width:720px;margin:0 auto;padding:30px 22px 0}
.eyebrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fv-name{font-family:var(--serif);font-size:clamp(32px,5.5vw,48px);font-weight:800;line-height:1.08;margin:10px 0 8px}

.know{background:var(--soft);border-radius:14px;padding:6px 16px 10px;margin:18px 0 6px}

.composer textarea{min-height:250px;font-size:17px;line-height:1.6}

.dn{font-size:21px;font-weight:800}.ds{font-size:13px;color:var(--muted)}
.ctx{background:var(--soft);border-radius:12px;padding:12px;margin-bottom:12px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0}

.tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.note{font-size:14px;white-space:pre-wrap;margin:4px 0}
.fl{display:block;font-size:13px;color:var(--muted);margin:10px 0}

.lines{display:grid;grid-template-columns:1fr auto;gap:8px;margin:6px 0 12px}

.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}

<body>
<header class="top">
  <div class="brand"><div class="logo" aria-hidden="true">GL</div><div><div class="title" id="venueTitle">Guest Ledger</div><div class="sub" id="weekLabel"></div></div></div>
  <nav class="actions">
    <button id="btnLoad" class="primary">Load Week</button>
    <button id="btnSheet">Pre-Shift Sheet</button>
    <button id="btnExport" hidden>Export</button>
    <button id="btnCols" hidden>Match Columns</button>
    <button id="btnSettings">Settings</button>
    <button id="btnBackup">Backup <span class="dot" id="backupDot" hidden></span></button>
  </nav>
  <nav class="houses" id="houseTabs" aria-label="Houses"></nav>
</header>
<div id="banner" class="banner" hidden></div>
<main>
  <section id="empty" class="empty">
    <div class="drop" id="drop">
      <h1>Drop This Week's SevenRooms Export</h1>
      <p class="fine" id="emptyHouse"></p>
      <p class="fine">Reservations from last Thursday through this Sunday. Add the client export too if the reservation file has no email column. CSV or Excel. Select both files at once.</p>
      <div class="row"><button class="primary" id="btnChoose">Choose File</button><button id="btnSample">Try With Sample Guests</button></div>
      <p class="fine">Files are read on this device only. Nothing is uploaded anywhere.</p>
    </div>
  </section>
  <section id="mapping" hidden></section>
  <section id="board" hidden>
    <div class="run" id="run"></div>
    <div class="score" id="score"></div>
    <div class="cols" id="cols"></div>
  </section>
</main>
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" hidden aria-label="Guest"></aside>
<aside id="settings" class="drawer wide" hidden aria-label="Settings"></aside>
<section id="sheetWrap" hidden>
  <div class="sheet-bar"><button id="btnPrint" class="primary">Print</button><button id="btnCopySheet">Copy</button><button id="btnCloseSheet">Close</button></div>
  <div id="sheet"></div>
</section>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="file" accept=".csv,.tsv,.txt,.xlsx,.xls,.json,text/csv" multiple hidden>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* ===== CORE: pure logic, no DOM ===== */
const MONTHS=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>{const t=new Date(y,m-1,d);return isNaN(t)?'':`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`};
const todayISO=()=>{const t=new Date();return iso(t.getFullYear(),t.getMonth()+1,t.getDate())};
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return iso(y,m,d+n)};
const daysBetween=(a,b)=>{const p=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};return Math.round((p(b)-p(a))/864e5)};

function toISO(s){
  s=String(s||'').trim();if(!s)return '';
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return iso(+m[1],+m[2],+m[3]);
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return iso(y,+m[1],+m[2])}
  m=s.match(/([A-Za-z]{3,})\.?\s+(\d{1,2})(?!\d)(?:st|nd|rd|th)?,?(?:\s+(\d{4}))?/);
  if(m){const mi=MONTHS.indexOf(m[1].slice(0,3).toLowerCase());if(mi>=0)return iso(m[3]?+m[3]:new Date().getFullYear(),mi+1,+m[2])}
  m=s.match(/(\d{1,2})\s+([A-Za-z]{3,})\.?,?(?:\s+(\d{4}))?/);
  if(m){const mi=MONTHS.indexOf(m[2].slice(0,3).toLowerCase());if(mi>=0)return iso(m[3]?+m[3]:new Date().getFullYear(),mi+1,+m[1])}
  return '';
}
function sniffDelimiter(text){
  const nl=text.search(/\r?\n/),line=nl>-1?text.slice(0,nl):text,c={',':0,';':0,'\t':0};let q=false;
  for(const ch of line){if(ch==='"')q=!q;else if(!q&&ch in c)c[ch]++}
  return Object.keys(c).sort((a,b)=>c[b]-c[a])[0];
}
function parseCSV(text,d){
  text=String(text).replace(/^﻿/,'');d=d||sniffDelimiter(text);

let toastT;
function toast(msg,actionLabel,action){
  const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${actionLabel?`<button type="button">${esc(actionLabel)}</button>`:''}`;t.hidden=false;

let xlsxLib=null;
function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  return xlsxLib||(xlsxLib=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>ok(window.XLSX);s.onerror=()=>{xlsxLib=null;no(new Error('xlsx'))};document.head.appendChild(s)}));
}
async function readTable(f){
  if(/\.xlsx?$/i.test(f.name)){
    const X=await loadXLSX(),wb=X.read(await f.arrayBuffer(),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
    return X.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}).map(r=>r.map(v=>String(v??'')));
  }
  return parseCSV(await f.text());
}
async function handleFiles(list){
  const files=[...list];if(!files.length)return;
  const js=files.find(f=>/\.json$/i.test(f.name));if(js)return restoreText(await js.text());
  pending=[];
  for(const f of files){
    let t;try{t=await readTable(f)}catch(e){toast(/xlsx/.test(e.message)?'Could not open the Excel file. Export as CSV instead.':`Could not read ${f.name}`);continue}
    if(!t||t.length<2){toast(`${f.name} looks empty`);continue}
    const headers=t[0].map(h=>String(h).trim()),saved=load(KEYS.M,{})[headers.join('|')];
    pending.push({name:f.name,headers,body:t.slice(1),map:saved||detect(headers)});
  }
  if(!pending.length)return;
  lastRaw=clone(pending);
  if(mapProblem())showMapping();else ingest();
}
function mapProblem(){
  if(!pending.some(p=>p.map.date!=null))return 'No visit date column found. Pick it below.';
  if(!pending.some(p=>p.map.date!=null&&(p.map.first!=null||p.map.full!=null)))return 'No guest name column found in the reservation file.';
  return '';
}
function ingest(){
  const maps=load(KEYS.M,{});for(const p of pending)maps[p.headers.join('|')]=p.map;save(KEYS.M,maps);
  const rows=merge(pending.map(p=>({type:p.map.date!=null?'res':'guest',rows:toRows(p.body,p.map)})));
  if(!rows.length){toast('No reservations found in that file');return}
  D={rows,loadedAt:new Date().toISOString(),files:pending.map(p=>p.name)};
  recordVisits(rows,L,todayISO());saveD();saveL();pending=[];
  renderAll();
  const noEmail=rows.filter(r=>!r.email).length;
  toast(`${rows.length} reservations loaded${noEmail?`. ${noEmail} ${noEmail===1?'has':'have'} no email`:''}`);
}

const sampleVal=(p,i)=>{if(i==null)return '';const r=p.body.find(r=>String(r[i]||'').trim());return r?String(r[i]).slice(0,48):''};

  $('#mapping').innerHTML=`<div class="mapbox"><h2>Help Me Read This File</h2>
  <p class="fine">SevenRooms names its columns its own way, so the ledger needs to know which column holds what. Each row below is one piece of guest info. Pick the column from your file that holds it. The gray text shows what that column contains, so you can check it.</p>

  ${pending.map((p,pi)=>`<div class="mapfile"><h3>${esc(p.name)}</h3><table>${FIELDS.map(([k,label])=>`<tr><td>${label}${k==='date'?' <span class="flag warn">Needed</span>':k==='first'||k==='full'?' <span class="flag warn">Name needed</span>':''}</td><td><select data-pi="${pi}" data-k="${k}"><option value="">Not in this file</option>${p.headers.map((h,i)=>`<option value="${i}"${p.map[k]===i?' selected':''}>${esc(h||`Column ${i+1}`)}</option>`).join('')}</select></td><td class="samp" id="s-${pi}-${k}">${esc(sampleVal(p,p.map[k]))}</td></tr>`).join('')}</table></div>`).join('')}
  <div class="err" id="mapErr">${esc(mapProblem())}</div>
  <div class="row" style="justify-content:flex-start"><button class="primary" data-act="applymap">Continue</button><button data-act="cancelmap">Cancel</button></div></div>`;

$('#mapping').addEventListener('change',e=>{
  const s=e.target.closest('select');if(!s)return;const p=pending[+s.dataset.pi],k=s.dataset.k;
  if(s.value==='')delete p.map[k];else p.map[k]=+s.value;
  $(`#s-${s.dataset.pi}-${k}`).textContent=sampleVal(p,p.map[k]);$('#mapErr').textContent=mapProblem();
});
$('#mapping').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='applymap'){const m=mapProblem();if(m){$('#mapErr').textContent=m;return}ingest()}

function show(which){for(const id of ['empty','mapping','board'])$('#'+id).hidden=id!==which}
function sortItems(a){
  const b=a.filter(x=>x.timing==='before').sort((x,y)=>(x.r.date+tsort(x.r.time)).localeCompare(y.r.date+tsort(y.r.time)));
  const f=a.filter(x=>x.timing==='after').sort((x,y)=>(y.r.date+tsort(y.r.time)).localeCompare(x.r.date+tsort(x.r.time)));
  return b.concat(f);
}
function boardOrder(){return S.categories.flatMap(c=>sortItems(Q.filter(x=>x.cat===c.id&&!x.handled&&!x.cooling))).map(x=>x.hid)}
function cardHTML(x){
  const r=x.r,diet=isDietary(r,S),tg=tagsByGroup(r),chips=id=>(tg[id]||[]).map(t=>`<span class="flag g-${TAG_GROUPS.find(g=>g.id===id).color}">${esc(t)}</span>`).join('');

  <div class="ct"><span class="nm">${esc(fullName(r))}</span><span class="tm ${x.timing}">${x.timing==='before'?'Before Visit':'Thank You'}</span></div>

function renderBoard(){
  const today=todayISO();Q=buildQueue(D.rows,S,L,today);
  const live=Q.filter(x=>!x.handled&&!x.cooling),tot=live.length+Q.filter(x=>x.handled).length,done=tot-live.length,pct=tot?Math.round(done/tot*100):0;
  $('#run').innerHTML=`<div class="prog" role="progressbar" aria-label="Queue progress" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><span class="pl">${live.length?`${done} of ${tot} done`:tot?'Queue clear. Every guest has been handled.':'Nothing to send this week'}</span>${live.length?`<button class="primary" id="btnStart">${done?'Continue Queue':'Start Queue'}</button>`:''}`;

    .map(([l,v])=>`<div class="metric"><div class="ml">${l}</div><div class="mv">${v}</div></div>`).join('');

    const items=Q.filter(x=>x.cat===c.id),lv=sortItems(items.filter(x=>!x.handled&&!x.cooling)),cool=sortItems(items.filter(x=>x.cooling)),done=items.filter(x=>x.handled);

  const isCel=r=>cel&&hit(hayOf(r),cel.keywords),isReg=r=>!isVip(r)&&reg&&(hit(hayOf(r),reg.keywords)||(r.visits!=null&&r.visits>=S.regularVisits)),isFir=r=>fir&&(hit(hayOf(r),fir.keywords)||(r.visits!=null&&r.visits<=1)),isDiet=r=>isDietary(r,S),isBig=r=>(+r.party||0)>=6;
  const cut=(t,n)=>t.length>n?t.slice(0,n)+'...':t;
  const notes=r=>cut([r.resNotes,r.clientNotes].filter(Boolean).join(' · '),240);
  const prefs=r=>{const t=T(r),p=TAG_GROUPS.filter(g=>g.pref&&t[g.id]).flatMap(g=>t[g.id]);return p.length?'Prefers: '+p.join(' · '):''};
  const both=r=>[prefs(r),notes(r)].filter(Boolean).join('. ');
  const occ=r=>{const o=occasionOf(hayOf(r));return o==='something special'?'Celebrating':o.replace(/^(your|a|an) /,'').replace(/^./,c=>c.toUpperCase())};
  const touch=r=>{const g=L.guests[guestKey(r)];return g?{pre:g.sent.some(s=>s.resDate===r.date&&s.timing==='before'),recov:g.sent.some(s=>s.cat==='recovery')}:{}};
  const line=(r,head,sub)=>`<li><b>${esc(r.time||'No time')}</b> ${esc(fullName(r))}${r.party?` · party of ${esc(r.party)}`:''}${head?` · ${esc(head)}`:''}${sub?`<div class="sx">${esc(sub)}</div>`:''}</li>`;
  const sec=(t,list)=>list.length?`<h4>${t} (${list.length})</h4><ul>${list.join('')}</ul>`:'';
  const byDate={};for(const r of ups)(byDate[r.date]=byDate[r.date]||[]).push(r);
  const q=quoteOfDay(today);
  let html=`<h1>${esc(placeName()||'Pre-Shift')} Pre-Shift</h1><p class="fine">Printed ${esc(fmtLong(today))}. Internal only.</p>
  <h4>Tonight's Focus</h4><div class="focus" id="sheetFocus" contenteditable="true" data-ph="Tap to write the one thing the team should nail tonight.">${esc(S.focusNote||'')}</div>`;
  if(!ups.length)html+=`<p>No upcoming reservations in the loaded file. Load an export that runs through this weekend.</p>`;
  for(const d of Object.keys(byDate)){
    const rs=byDate[d],covers=rs.reduce((n,r)=>n+(+r.party||0),0),pace={};
    for(const r of rs){const k=slot(r.time),p=pace[k]||(pace[k]={c:0,t:0});p.c+=+r.party||0;p.t++}
    const peak=Math.max(1,...Object.values(pace).map(p=>p.c));
    const stat=(n,one,many)=>n?`<span class="flag">${n} ${n===1?one:many}</span>`:'';
    const wrote=rs.map(r=>[r,touch(r)]).filter(([,t])=>t.pre||t.recov).map(([r,t])=>line(r,t.recov?'Second chance':'Got a note from '+(S.sender||'us'),t.recov?'We wrote after a rough visit. Make this one right.':'Greet them by name. They are expecting us.'));
    html+=`<h2>${esc(fmtLong(d))}</h2>
    <div class="stats">${stat(rs.length,'reservation','reservations')}${stat(covers,'cover','covers')}${stat(rs.filter(isAtt).length,'special attention','special attention')}${stat(rs.filter(isVip).length,'VIP','VIPs')}${stat(rs.filter(isCel).length,'celebrating','celebrating')}${stat(rs.filter(isDiet).length,'dietary','dietary')}${stat(rs.filter(isFir).length,'first visit','first visits')}${stat(rs.filter(isReg).length,'regular','regulars')}${stat(rs.filter(isBig).length,'large party','large parties')}</div>
    <h4>Pacing</h4><div class="pace">${Object.keys(pace).sort().map(k=>`<div><b>${fmt12(k)}</b><span>${pace[k].c} covers · ${pace[k].t} ${pace[k].t===1?'table':'tables'}</span><i style="width:${Math.round(pace[k].c/peak*100)}%"></i></div>`).join('')}</div>
    ${sec('Special Attention',rs.filter(isAtt).map(r=>line(r,T(r).attention.join(' · '),notes(r))))}
    ${sec('Blacklist',rs.filter(isBlk).map(r=>line(r,'See a manager',notes(r))))}
    ${sec('VIPs',rs.filter(isVip).map(r=>line(r,[...(T(r).vip||[]),r.visits!=null?`${r.visits} visits`:''].filter(Boolean).join(' · '),both(r))))}
    ${sec('Celebrations',rs.filter(isCel).map(r=>line(r,occ(r),both(r))))}
    ${sec('Dietary and Allergies',rs.filter(isDiet).map(r=>line(r,(T(r).dietary||[]).join(' · '),notes(r))))}
    ${sec('Regulars',rs.filter(isReg).map(r=>line(r,r.visits!=null?`${r.visits} visits`:'',both(r))))}
    ${sec('First Visits',rs.filter(isFir).map(r=>line(r,'',notes(r))))}
    ${sec('Large Parties',rs.filter(isBig).map(r=>line(r,'',notes(r))))}
    ${sec('Guests We Have Written To',wrote)}`;
  }
  if(q)html+=`<div class="quote"><q>${esc(q.q)}</q>${q.a?`<span>${esc(q.a)}</span>`:''}</div>`;
  $('#sheet').innerHTML=html;$('#sheetWrap').hidden=false;
  $('#sheetFocus').addEventListener('input',e=>{S.focusNote=e.target.innerText.trim();saveS()});
}
$('#btnSheet').onclick=()=>{if(!D.rows.length){toast('Load an export first');return}buildSheet()};
$('#btnCloseSheet').onclick=()=>$('#sheetWrap').hidden=true;
$('#btnPrint').onclick=()=>{try{window.print()}catch(_){toast('Printing is blocked here. Use Copy.')}};

/* ---------- banners, wiring ---------- */
function banner(){
  const b=$('#banner'),h=load(KEYS.H,{}),ios=/iPad|iPhone/.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
  let inFrame=false;try{inFrame=window.top!==window.self}catch(_){inFrame=true}
  if(!storageOK){b.innerHTML='<span>This browser is not saving data. Use Backup at the end of each session.</span>';b.hidden=false;return}
  if(ios&&!navigator.standalone&&!inFrame&&!h.installDismissed){b.innerHTML='<span>Add this to your Home Screen so your guest history is never cleared: Share, then Add to Home Screen.</span><button data-act="dismiss">Got it</button>';b.hidden=false;return}
  b.hidden=true;
}
$('#banner').addEventListener('click',e=>{if(e.target.closest('[data-act="dismiss"]')){const h=load(KEYS.H,{});h.installDismissed=true;save(KEYS.H,h);$('#banner').hidden=true}});
